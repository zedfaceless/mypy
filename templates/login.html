{% extends "layout.html" %} {% block title %}Login{% endblock %} {% block
content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded p-6 shadow">
  <h2 class="text-2xl mb-4">Login</h2>
  <form method="post">
    <label class="block mb-2"
      >Username
      <input name="username" class="w-full p-2 border rounded" required />
    </label>
    <label class="block mb-4"
      >Password
      <input
        name="password"
        type="password"
        class="w-full p-2 border rounded"
        required
      />
    </label>
    <div class="flex items-center justify-between">
      <button class="bg-blue-600 text-white px-4 py-2 rounded">Login</button>
      <a href="{{ url_for('register') }}" class="text-sm text-blue-600"
        >Register</a
      >
    </div>
  </form>
</div>
{% endblock %}
