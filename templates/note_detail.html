{% extends "layout.html" %} {% block title %}{{ note.title }}{% endblock %} {%
block content %}
<h1 class="text-2xl mb-2">{{ note.title }}</h1>
<p class="text-gray-500 mb-4">Created: {{ note.created_at }}</p>
<div class="prose dark:prose-invert">
  {{ note.content | replace("\n", "<br />") | safe }}
</div>

<div class="mt-4">
  <a
    href="{{ url_for('notes_edit', note_id=note._id) }}"
    class="px-3 py-1 bg-yellow-500 text-white rounded"
    >Edit</a
  >
  <form
    method="post"
    action="{{ url_for('notes_delete', note_id=note._id) }}"
    style="display: inline"
  >
    <button
      class="px-3 py-1 bg-red-600 text-white rounded"
      onclick="return confirm('Delete?')"
    >
      Delete
    </button>
  </form>
</div>
{% endblock %}
