{% extends "layout.html" %} {% block title %}My Notes{% endblock %} {% block
content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl">My Notes</h1>
  <form method="get" class="flex">
    <input
      name="q"
      value="{{ q }}"
      placeholder="Search..."
      class="px-3 py-2 border rounded-l"
    />
    <button class="px-3 py-2 bg-gray-200 rounded-r">Search</button>
  </form>
</div>

{% if notes %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  {% for note in notes %}
  <div class="p-4 bg-white dark:bg-gray-800 rounded shadow">
    <div class="flex justify-between">
      <a
        href="{{ url_for('notes_detail', note_id=note._id) }}"
        class="text-lg font-semibold"
        >{{ note.title }}</a
      >
      <small class="text-gray-500">{{ note.created_at }}</small>
    </div>
    <p class="mt-2 text-gray-700 dark:text-gray-300">
      {{ note.content|truncate(200) }}
    </p>
    <div class="mt-3 flex items-center gap-2">
      <a
        class="px-3 py-1 bg-yellow-500 text-white rounded"
        href="{{ url_for('notes_edit', note_id=note._id) }}"
        >Edit</a
      >
      <form
        method="post"
        action="{{ url_for('notes_delete', note_id=note._id) }}"
        style="display: inline"
      >
        <button
          class="px-3 py-1 bg-red-600 text-white rounded"
          onclick="return confirm('Delete this note?')"
        >
          Delete
        </button>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<p>
  No notes found.
  <a href="{{ url_for('notes_add') }}" class="text-blue-600">Add a note</a>.
</p>
{% endif %} {% endblock %}
